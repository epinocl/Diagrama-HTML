<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1191 842" width="1191" height="842" style="background:#ffffff;">
  <defs>
    <style>
      .cad-border { stroke: #0f172a; stroke-width: 1.5; fill: none; }
      .cad-thin { stroke: #334155; stroke-width: 0.8; fill: none; }
      .cad-text { font-family: 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .grid-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .title-label { font-size: 8.5px; fill: #475569; font-weight: 600; text-transform: uppercase; }
      .title-value { font-size: 11px; fill: #0f172a; font-weight: bold; }
      .title-main { font-size: 14px; fill: #0284c7; font-weight: 800; letter-spacing: 0.5px; }
      .brand-title { font-size: 16px; font-weight: 900; fill: #0f172a; letter-spacing: 1px; }
    </style>
  </defs>

  <!-- Marco Exterior A3 -->
  <rect x="15" y="15" width="1161" height="812" class="cad-thin"/>

  <!-- Marco Interior Principal (Margen de encuadernación 30mm izq, 15mm sup/der/inf) -->
  <rect x="40" y="30" width="1125" height="782" class="cad-border"/>

  <!-- Franja de Cuadrícula Superior e Inferior (Columnas 8 a 1) -->
  <!-- Coordenadas X: 40 a 1165 (ancho 1125 / 8 = 140.625 cada columna) -->
  <!-- Col 8: 40..180 | Col 7: 180..321 | Col 6: 321..461 | Col 5: 461..602 | Col 4: 602..743 | Col 3: 743..883 | Col 2: 883..1024 | Col 1: 1024..1165 -->
  <line x1="40" y1="45" x2="1165" y2="45" class="cad-thin"/>
  <line x1="40" y1="797" x2="1165" y2="797" class="cad-thin"/>

  <!-- Divisiones Columnas Superior e Inferior -->
  <!-- X = 180.6 -->
  <line x1="180.6" y1="30" x2="180.6" y2="45" class="cad-thin"/><line x1="180.6" y1="797" x2="180.6" y2="812" class="cad-thin"/>
  <!-- X = 321.2 -->
  <line x1="321.2" y1="30" x2="321.2" y2="45" class="cad-thin"/><line x1="321.2" y1="797" x2="321.2" y2="812" class="cad-thin"/>
  <!-- X = 461.8 -->
  <line x1="461.8" y1="30" x2="461.8" y2="45" class="cad-thin"/><line x1="461.8" y1="797" x2="461.8" y2="812" class="cad-thin"/>
  <!-- X = 602.5 -->
  <line x1="602.5" y1="30" x2="602.5" y2="45" class="cad-thin"/><line x1="602.5" y1="797" x2="602.5" y2="812" class="cad-thin"/>
  <!-- X = 743.1 -->
  <line x1="743.1" y1="30" x2="743.1" y2="45" class="cad-thin"/><line x1="743.1" y1="797" x2="743.1" y2="812" class="cad-thin"/>
  <!-- X = 883.7 -->
  <line x1="883.7" y1="30" x2="883.7" y2="45" class="cad-thin"/><line x1="883.7" y1="797" x2="883.7" y2="812" class="cad-thin"/>
  <!-- X = 1024.3 -->
  <line x1="1024.3" y1="30" x2="1024.3" y2="45" class="cad-thin"/><line x1="1024.3" y1="797" x2="1024.3" y2="812" class="cad-thin"/>

  <!-- Etiquetas de Columnas (8 a 1 de izq a der) -->
  <text x="110.3" y="38" class="grid-label">8</text><text x="110.3" y="805" class="grid-label">8</text>
  <text x="250.9" y="38" class="grid-label">7</text><text x="250.9" y="805" class="grid-label">7</text>
  <text x="391.5" y="38" class="grid-label">6</text><text x="391.5" y="805" class="grid-label">6</text>
  <text x="532.1" y="38" class="grid-label">5</text><text x="532.1" y="805" class="grid-label">5</text>
  <text x="672.8" y="38" class="grid-label">4</text><text x="672.8" y="805" class="grid-label">4</text>
  <text x="813.4" y="38" class="grid-label">3</text><text x="813.4" y="805" class="grid-label">3</text>
  <text x="954.0" y="38" class="grid-label">2</text><text x="954.0" y="805" class="grid-label">2</text>
  <text x="1094.6" y="38" class="grid-label">1</text><text x="1094.6" y="805" class="grid-label">1</text>

  <!-- Franja de Cuadrícula Izquierda y Derecha (Filas A a F) -->
  <!-- Alto útil 782 - 30 = 752 / 6 = 125.33 cada fila -->
  <line x1="55" y1="45" x2="55" y2="797" class="cad-thin"/>
  <line x1="1150" y1="45" x2="1150" y2="797" class="cad-thin"/>

  <!-- Divisiones Filas Izquierda y Derecha -->
  <line x1="40" y1="170.3" x2="55" y2="170.3" class="cad-thin"/><line x1="1150" y1="170.3" x2="1165" y2="170.3" class="cad-thin"/>
  <line x1="40" y1="295.6" x2="55" y2="295.6" class="cad-thin"/><line x1="1150" y1="295.6" x2="1165" y2="295.6" class="cad-thin"/>
  <line x1="40" y1="421.0" x2="55" y2="421.0" class="cad-thin"/><line x1="1150" y1="421.0" x2="1165" y2="421.0" class="cad-thin"/>
  <line x1="40" y1="546.3" x2="55" y2="546.3" class="cad-thin"/><line x1="1150" y1="546.3" x2="1165" y2="546.3" class="cad-thin"/>
  <line x1="40" y1="671.6" x2="55" y2="671.6" class="cad-thin"/><line x1="1150" y1="671.6" x2="1165" y2="671.6" class="cad-thin"/>

  <!-- Etiquetas de Filas (A a F de arriba hacia abajo) -->
  <text x="47.5" y="107.6" class="grid-label">A</text><text x="1157.5" y="107.6" class="grid-label">A</text>
  <text x="47.5" y="233.0" class="grid-label">B</text><text x="1157.5" y="233.0" class="grid-label">B</text>
  <text x="47.5" y="358.3" class="grid-label">C</text><text x="1157.5" y="358.3" class="grid-label">C</text>
  <text x="47.5" y="483.6" class="grid-label">D</text><text x="1157.5" y="483.6" class="grid-label">D</text>
  <text x="47.5" y="609.0" class="grid-label">E</text><text x="1157.5" y="609.0" class="grid-label">E</text>
  <text x="47.5" y="734.3" class="grid-label">F</text><text x="1157.5" y="734.3" class="grid-label">F</text>

  <!-- ========================================================================= -->
  <!-- CAJETÍN NORMALIZADO DE INGENIERÍA (Esquina inferior derecha)              -->
  <!-- ========================================================================= -->
  <g id="cajetin_axon">
    <!-- Contenedor Cajetín X: 350 a 1150 (ancho 800), Y: 725 a 797 (alto 72) -->
    <rect x="350" y="725" width="800" height="72" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Bloque 1: Control de Revisiones y Firmas (350 a 550) -->
    <line x1="420" y1="725" x2="420" y2="797" class="cad-thin"/>
    <line x1="475" y1="725" x2="475" y2="797" class="cad-thin"/>
    <line x1="550" y1="725" x2="550" y2="797" class="cad-thin"/>
    
    <line x1="350" y1="743" x2="550" y2="743" class="cad-thin"/>
    <line x1="350" y1="761" x2="550" y2="761" class="cad-thin"/>
    <line x1="350" y1="779" x2="550" y2="779" class="cad-thin"/>

    <text x="354" y="738" class="title-label">DIBUJADO</text>
    <text x="424" y="738" class="title-value">AXON ING.</text>
    <text x="480" y="738" class="title-value">2026-10-16</text>

    <text x="354" y="756" class="title-label">REVISADO</text>
    <text x="424" y="756" class="title-value">EPINO</text>
    <text x="480" y="756" class="title-value">2026-10-16</text>

    <text x="354" y="774" class="title-label">APROBADO</text>
    <text x="424" y="774" class="title-value">CLIENTE</text>
    <text x="480" y="774" class="title-value">2026-10-16</text>

    <text x="354" y="792" class="title-label">NORMA</text>
    <text x="424" y="792" class="title-value">IEC 60617</text>
    <text x="480" y="792" class="title-value">REV. 0</text>

    <!-- Bloque 2: Cliente y Título del Proyecto (550 a 870) -->
    <line x1="870" y1="725" x2="870" y2="797" class="cad-thin"/>
    <line x1="550" y1="745" x2="870" y2="745" class="cad-thin"/>
    
    <text x="560" y="737" class="title-label">CLIENTE:</text>
    <text x="615" y="738" class="title-value" font-size="12">GARDEN HOUSE</text>

    <text x="560" y="758" class="title-label">PROYECTO:</text>
    <text x="560" y="775" class="title-main">PICK AND PLACE - LINEA FARMACEUTICA</text>
    <text x="560" y="791" class="title-value" fill="#475569">DIAGRAMA ELECTRICO, CONTROL Y NEUMATICA</text>

    <!-- Bloque 3: Datos de Lámina y Escala (870 a 1030) -->
    <line x1="1030" y1="725" x2="1030" y2="797" class="cad-thin"/>
    <line x1="870" y1="749" x2="1030" y2="749" class="cad-thin"/>
    <line x1="870" y1="773" x2="1030" y2="773" class="cad-thin"/>

    <text x="876" y="737" class="title-label">CODIGO:</text>
    <text x="925" y="741" class="title-value" fill="#dc2626">DE-1708</text>

    <text x="876" y="761" class="title-label">ESCALA:</text>
    <text x="925" y="764" class="title-value">1:1 (A3)</text>

    <text x="876" y="785" class="title-label">PLANO N°:</text>
    <text x="925" y="789" class="title-value">1708-E-001</text>

    <!-- Bloque 4: Número de Hoja y Total (1030 a 1150) -->
    <line x1="1030" y1="760" x2="1150" y2="760" class="cad-thin"/>
    <text x="1040" y="742" class="title-label">HOJA / PAGINA</text>
    <text x="1090" y="754" class="title-value" font-size="16" fill="#0284c7" text-anchor="middle">01 / 38</text>
    
    <text x="1040" y="774" class="title-label">ESTADO</text>
    <text x="1090" y="790" class="title-value" font-size="12" fill="#16a34a" text-anchor="middle">AS-BUILT</text>
  </g>
</svg>
