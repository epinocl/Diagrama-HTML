<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" style="background:#ffffff;">
  <defs>
    <style>
      .wire { stroke: #0f172a; stroke-width: 2; fill: none; stroke-linecap: round; }
      .component { stroke: #0f172a; stroke-width: 2.2; fill: none; }
      .fill-box { fill: #f8fafc; stroke: #0f172a; stroke-width: 2; }
      .sym-text { font-family: Arial, sans-serif; font-size: 11px; fill: #1e293b; text-anchor: middle; }
      .pin-label { font-family: monospace; font-size: 9px; fill: #475569; }
    </style>
  </defs>

  <!-- Optocupla Bobina -->
  <rect x="40" y="30" width="80" height="60" rx="3" class="fill-box"/>
  <line x1="40" y1="60" x2="120" y2="60" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M 65 42 L 75 58 L 85 42 Z" fill="#0f172a"/>
  <line x1="60" y1="58" x2="90" y2="58" class="wire"/>
  <line x1="80" y1="10" x2="80" y2="30" class="wire"/>
  <line x1="80" y1="90" x2="80" y2="110" class="wire"/>
  <text x="95" y="24" class="pin-label">A1 (+)</text>
  <text x="95" y="104" class="pin-label">A2 (-)</text>
  <text x="80" y="78" class="sym-text" font-weight="bold">OPTO</text>

</svg>